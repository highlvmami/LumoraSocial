<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akış · LumoraSocial</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#1f4e8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button type="button" class="menu-btn" id="menu-btn" aria-label="Menüyü aç" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="menu-dot hidden" id="menu-dot"></span>
      </button>
      <div class="brand"><span>Lumora</span>Social</div>
      <form class="top-search" id="side-search" role="search">
        <input type="search" name="q" placeholder="Ara…" autocomplete="off" maxlength="80">
      </form>
    </div>
  </header>

  <div class="layout">
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <aside class="sidebar" id="sidebar">
      <section class="card profile-card" id="profile-card"></section>
      <nav class="card nav" id="nav">
        <a href="#/" data-route="feed">Akış</a>
        <a href="#" data-route="me" id="nav-me">Profilim</a>
        <a href="#/kesfet" data-route="explore">Keşfet</a>
        <a href="#/ara" data-route="search">Ara</a>
        <a href="#/kaydedilenler" data-route="bookmarks">Kaydedilenler</a>
        <a href="#/mesajlar" data-route="messages">Mesajlar <span class="count-badge hidden" id="unread-messages"></span></a>
        <a href="#/bildirimler" data-route="notifications">Bildirimler <span class="count-badge hidden" id="unread-count"></span></a>
        <a href="#/ayarlar/profil" data-route="settings">Ayarlar</a>
        <a href="/yonetim" id="nav-admin" class="hidden">Yönetim paneli</a>
        <button type="button" id="logout-btn">Çıkış yap</button>
      </nav>
      <section class="card suggestions hidden" id="suggestions"></section>
    </aside>

    <main class="feed" id="main"></main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
