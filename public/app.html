<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akış · LumoraSocial</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#1f4e8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button type="button" class="menu-btn" id="menu-btn" aria-label="Menüyü aç" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="menu-dot hidden" id="menu-dot"></span>
      </button>
      <div class="brand"><span>Lumora</span>Social</div>
      <form class="top-search" id="side-search" role="search">
        <input type="search" name="q" placeholder="Ara…" autocomplete="off" maxlength="80">
      </form>
      <a class="top-bell" href="#/bildirimler" aria-label="Bildirimler">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="count-badge hidden" id="unread-bell"></span>
      </a>
    </div>
  </header>

  <div class="layout">
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <aside class="sidebar" id="sidebar">
      <section class="card profile-card" id="profile-card"></section>
      <nav class="card nav" id="nav">
        <a href="#/" data-route="feed">Akış</a>
        <a href="#" data-route="me" id="nav-me">Profilim</a>
        <a href="#/kesfet" data-route="explore">Keşfet</a>
        <a href="#/ara" data-route="search">Ara</a>
        <a href="#/kaydedilenler" data-route="bookmarks">Kaydedilenler</a>
        <a href="#/mesajlar" data-route="messages">Mesajlar <span class="count-badge hidden" id="unread-messages"></span></a>
        <a href="#/bildirimler" data-route="notifications">Bildirimler <span class="count-badge hidden" id="unread-count"></span></a>
        <a href="#/ayarlar/profil" data-route="settings">Ayarlar</a>
        <a href="/yonetim" id="nav-admin" class="hidden">Yönetim paneli</a>
        <button type="button" id="logout-btn">Çıkış yap</button>
      </nav>
      <section class="card suggestions hidden" id="suggestions"></section>
    </aside>

    <main class="feed" id="main"></main>
  </div>

  <!-- Mobil alt menü -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="Alt menü">
    <a href="#/" data-route="feed" aria-label="Ana sayfa"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Akış</span></a>
    <a href="#/kesfet" data-route="explore" aria-label="Keşfet"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Keşfet</span></a>
    <button type="button" class="bottom-plus" id="create-btn" aria-label="Paylaş"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <a href="#/mesajlar" data-route="messages" aria-label="Mesajlar"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg><span>Mesajlar</span><span class="count-badge hidden" id="unread-messages-bottom"></span></a>
    <button type="button" id="bottom-menu" aria-label="Menü" aria-controls="sidebar"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Menü</span><span class="menu-dot hidden" id="menu-dot-bottom"></span></button>
  </nav>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
